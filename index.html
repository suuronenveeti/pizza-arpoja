<!DOCTYPE html>
<html lang="fi">
<head>

    <title>Pizza-arpoja</title>
    <link rel="stylesheet" href="styles.css">

    <script>

        }

<body>

    <button onclick="generoiPizza()">Arvo pizza</button>

    <div id="tulosAlue" style="display: none;">
        <h2>Pizzasi täytteet:</h2>
        <ul id="tayteLista"></ul>
        <div id="mausteOsuus"></div>
    </div>


</body>
</html>
