<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza-arpoja</title>
    <link rel="stylesheet" href="styles.css">
    <script>
        // Ladataan tumma tila heti alussa välkkymisen estämiseksi
        if (localStorage.getItem("theme") === "dark") {
            document.documentElement.classList.add("dark-mode");
        }
    </script>
</head>
<body>  

    <h1>Pizza-arpoja</h1>

    <!-- Valinnat -->
    <div class="button-group">
        <button id="pizza-4-btn" onclick="generoiPizza(4)">Arvo 4 täytteen pizza</button>
        <button id="pizza-3-btn" onclick="generoiPizza(3)">Arvo 3 täytteen pizza</button>
        <button id="juoma-btn" onclick="generoiJuoma()">Arvo juoma</button>
    </div>

    <!-- Pizzan tulosalue -->
    <div id="tulosAlue" style="display: none;">
        <h2>Pizzasi täytteet:</h2>
        <ul id="tayteLista"></ul>
    </div>

    <!-- Juoman tulosalue -->
    <div id="juomaAlue" style="display: none;">
        <h2>Juoma:</h2>
        <ul id="juomaLista"></ul>
    </div>

    <button id="theme-toggle">Vaihda teemaa</button>

    <!-- Skripti ladataan vasta kun HTML on luettu -->
    <script src="script.js"></script>
</body>
</html>
